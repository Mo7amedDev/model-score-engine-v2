services:
  api:
    build: .
    container_name: modelscoreengine_api
    image: modelscoreengine:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8123:8000"
    env_file:
      - .env.production
    depends_on:
      - redis
    restart: unless-stopped
  worker:
    image: modelscoreengine:latest
    container_name: modelscoreengine_worker
    command: celery -A app.services.celery_app.celery worker --loglevel=info
    env_file:
      - .env.production
    depends_on:
      - redis
    restart: unless-stopped

  beat:
    image: modelscoreengine:latest
    container_name: modelscoreengine_beat
    command: celery -A app.services.celery_app.celery beat --loglevel=info
    env_file:
      - .env.production
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis_db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: